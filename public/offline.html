<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DEDURA＋</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F3F5F8; color: #20262F;
      font-family: 'BIZ UDPGothic', 'Hiragino Sans', 'Noto Sans JP', system-ui, sans-serif; padding: 24px 16px; box-sizing: border-box; }
    .card { background: #fff; border: 1px solid #E3E7EE; border-radius: 16px; padding: 28px 22px; max-width: 420px; width: 100%; text-align: center; }
    .mark { width: 56px; height: 56px; border-radius: 50%; background: #1B2A4A; color: #fff; font-weight: 700; font-size: 22px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 16px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .vi { color: #5B6475; font-size: 15px; margin: 0 0 16px; }
    p { font-size: 15px; line-height: 1.7; margin: 0 0 6px; }
    p.sub { color: #5B6475; font-size: 14px; margin-bottom: 20px; }
    button { width: 100%; min-height: 52px; border: 0; border-radius: 12px; background: #F5A623; color: #20262F; font: inherit; font-size: 17px; font-weight: 700; cursor: pointer; }
    button:active { background: #DD9314; }
    .small { color: #5B6475; font-size: 13px; margin-top: 14px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">D</div>
    <h1>電波がありません</h1>
    <p class="vi">Không có sóng</p>
    <p>電波のよい所でもう一度開いてください。</p>
    <p class="sub">Hãy mở lại ở nơi có sóng tốt.</p>
    <button type="button" onclick="location.reload()">もう一度 / Thử lại</button>
    <p class="small">入力していた内容は、この画面を開く前に保存できていなければ残っていません。<br>Nội dung chưa lưu sẽ không còn.</p>
  </main>
</body>
</html>
